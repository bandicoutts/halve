<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Halve hollow-symbol directions, A and B</title>
  <desc id="desc">Comparison of full hollow symbols and two hollow halves forming one ring, shown on light and dark themes.</desc>
  <defs>
    <style>
      .sans { font-family: 'Avenir Next', Avenir, sans-serif; }
      .serif { font-family: Georgia, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <mask id="ring-a-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="black"/>
      <circle cx="50" cy="50" r="42" fill="white"/>
      <circle cx="50" cy="50" r="22" fill="black"/>
    </mask>
    <mask id="ring-b-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="black"/>
      <circle cx="50" cy="50" r="42" fill="white"/>
      <circle cx="50" cy="50" r="29.5" fill="black"/>
    </mask>
    <mask id="half-left-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="black"/>
      <path d="M50 8 A42 42 0 0 0 50 92 L50 72 A22 22 0 0 1 50 28 Z" fill="white"/>
    </mask>
    <mask id="half-right-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="black"/>
      <path d="M50 8 A42 42 0 0 1 50 92 L50 72 A22 22 0 0 0 50 28 Z" fill="white"/>
    </mask>
    <mask id="whole-ring-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="black"/>
      <circle cx="50" cy="50" r="42" fill="white"/>
      <circle cx="50" cy="50" r="22" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="820" fill="#F5F0E6"/>
  <text x="72" y="62" class="mono" font-size="13" font-weight="600" letter-spacing="2" fill="#6E6455">HALVE · HOLLOW SYMBOL EXPLORATION · 02</text>
  <text x="72" y="116" class="serif" font-size="43" fill="#211B14">One idea, two readings.</text>
  <text x="72" y="151" class="sans" font-size="17" fill="#6E6455">In both, the opening is transparent. The background colour shows through.</text>

  <!-- A: each piece is a full ring -->
  <rect x="72" y="190" width="510" height="570" rx="18" fill="#FDFAF3" stroke="#D8CFC0"/>
  <text x="104" y="233" class="mono" font-size="12" font-weight="700" letter-spacing="1.7" fill="#DE5F27">A · FULL HOLLOW SYMBOLS</text>
  <text x="104" y="273" class="serif" font-size="28" fill="#211B14">Two complete rings</text>
  <text x="104" y="302" class="sans" font-size="14" fill="#6E6455">Each cell gets a whole ring. The colours distinguish</text>
  <text x="104" y="322" class="sans" font-size="14" fill="#6E6455">the pair; the hole stays visible in both.</text>
  <g transform="translate(176 349) scale(1.05)"><circle cx="50" cy="50" r="42" fill="#DE5F27" mask="url(#ring-a-mask)"/></g>
  <g transform="translate(346 349) scale(1.05)"><circle cx="50" cy="50" r="42" fill="#1E9C8F" mask="url(#ring-b-mask)"/></g>
  <text x="231" y="474" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.2" fill="#6E6455">AMBER</text>
  <text x="401" y="474" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.2" fill="#6E6455">TEAL</text>
  <text x="104" y="515" class="sans" font-size="13" fill="#6E6455">At board size</text>
  <g transform="translate(104 529)">
    <rect width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(10 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#DE5F27" mask="url(#ring-a-mask)"/></g>
    <rect x="66" width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(76 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#1E9C8F" mask="url(#ring-b-mask)"/></g>
    <rect x="132" width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(142 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#DE5F27" mask="url(#ring-a-mask)"/></g>
    <rect x="198" width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(208 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#1E9C8F" mask="url(#ring-b-mask)"/></g>
  </g>
  <text x="104" y="633" class="sans" font-size="13" fill="#6E6455">On a dark surface</text>
  <g transform="translate(104 647)">
    <rect width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(10 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#E8703A" mask="url(#ring-a-mask)"/></g>
    <rect x="66" width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(76 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#45BFB2" mask="url(#ring-b-mask)"/></g>
    <rect x="132" width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(142 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#E8703A" mask="url(#ring-a-mask)"/></g>
    <rect x="198" width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(208 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#45BFB2" mask="url(#ring-b-mask)"/></g>
  </g>

  <!-- B: pieces are complementary halves -->
  <rect x="618" y="190" width="510" height="570" rx="18" fill="#FDFAF3" stroke="#D8CFC0"/>
  <text x="650" y="233" class="mono" font-size="12" font-weight="700" letter-spacing="1.7" fill="#DE5F27">B · TWO HALVES, ONE RING</text>
  <text x="650" y="273" class="serif" font-size="28" fill="#211B14">One shared opening</text>
  <text x="650" y="302" class="sans" font-size="14" fill="#6E6455">Each cell gets a curved half. Together they complete</text>
  <text x="650" y="322" class="sans" font-size="14" fill="#6E6455">a ring, with the centre still open to the surface.</text>
  <g transform="translate(694 349) scale(1.05)"><circle cx="50" cy="50" r="42" fill="#DE5F27" mask="url(#half-left-mask)"/></g>
  <g transform="translate(812 349) scale(1.05)"><circle cx="50" cy="50" r="42" fill="#1E9C8F" mask="url(#half-right-mask)"/></g>
  <path d="M906 401h30m-7-7 7 7-7 7" fill="none" stroke="#A89B88" stroke-width="1.5"/>
  <g transform="translate(951 349) scale(1.05)"><circle cx="50" cy="50" r="42" fill="#DE5F27" mask="url(#half-left-mask)"/><circle cx="50" cy="50" r="42" fill="#1E9C8F" mask="url(#half-right-mask)"/></g>
  <text x="746" y="474" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.2" fill="#6E6455">AMBER HALF</text>
  <text x="864" y="474" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.2" fill="#6E6455">TEAL HALF</text>
  <text x="1004" y="474" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.2" fill="#6E6455">TOGETHER</text>
  <text x="650" y="515" class="sans" font-size="13" fill="#6E6455">At board size</text>
  <g transform="translate(650 529)">
    <rect width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(10 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#DE5F27" mask="url(#half-left-mask)"/></g>
    <rect x="66" width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(76 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#1E9C8F" mask="url(#half-right-mask)"/></g>
    <rect x="132" width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(142 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#DE5F27" mask="url(#half-left-mask)"/></g>
    <rect x="198" width="56" height="56" rx="9" fill="#F5F0E6" stroke="#E3DACE"/>
    <g transform="translate(208 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#1E9C8F" mask="url(#half-right-mask)"/></g>
  </g>
  <text x="650" y="633" class="sans" font-size="13" fill="#6E6455">On a dark surface</text>
  <g transform="translate(650 647)">
    <rect width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(10 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#E8703A" mask="url(#half-left-mask)"/></g>
    <rect x="66" width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(76 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#45BFB2" mask="url(#half-right-mask)"/></g>
    <rect x="132" width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(142 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#E8703A" mask="url(#half-left-mask)"/></g>
    <rect x="198" width="56" height="56" rx="9" fill="#1F1A15" stroke="#514638"/>
    <g transform="translate(208 10) scale(.36)"><circle cx="50" cy="50" r="42" fill="#45BFB2" mask="url(#half-right-mask)"/></g>
  </g>
  <text x="72" y="795" class="sans" font-size="13" fill="#6E6455">The holes are true cut-outs, not painted circles, so the cell or page surface shows through in either theme.</text>
</svg>
