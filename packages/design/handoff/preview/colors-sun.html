<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:28px 32px; background:var(--bg); display:flex; gap:10px; }
  .sw { flex:1; }
  .chip { height:72px; border-radius:var(--radius-md); display:flex; align-items:flex-end; padding:8px; box-sizing:border-box; }
  .name { font-size:11px; font-weight:600; color:var(--fg-1); margin-top:8px; letter-spacing:-0.01em; }
  .hex { font-size:11px; color:var(--fg-3); font-variant-numeric:tabular-nums; margin-top:2px; }
  .tag { font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:var(--fire-tint)"><span class="tag" style="color:var(--fire-strong)">tint</span></div><div class="name">fire&#8209;tint</div><div class="hex">#F8E4DC</div></div>
  <div class="sw"><div class="chip" style="background:var(--fire-bright)"></div><div class="name">fire&#8209;bright</div><div class="hex">#E86B38</div></div>
  <div class="sw"><div class="chip" style="background:var(--fire-disc)"><span class="tag" style="color:#fff">disc</span></div><div class="name">fire&#8209;disc</div><div class="hex">#D45220</div></div>
  <div class="sw"><div class="chip" style="background:var(--fire)"><span class="tag" style="color:#fff">accent</span></div><div class="name">fire</div><div class="hex">#B03E12</div></div>
  <div class="sw"><div class="chip" style="background:var(--fire-strong)"><span class="tag" style="color:#fff">press</span></div><div class="name">fire&#8209;strong</div><div class="hex">#943210</div></div>
</body>
</html>
