<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:24px 24px; background:var(--bg); display:flex; gap:14px; }
  .panel { flex:1; padding:18px; border-radius:var(--radius-lg); }
  .panel.dk { background:var(--bg); border:1px solid var(--hairline); }
  .row { display:flex; gap:9px; justify-content:center; }
  .cell { width:46px; height:46px; flex:none; border-radius:var(--radius-cell); display:flex; align-items:center; justify-content:center; }
  .empty { background:var(--surface-raised); border:1px solid var(--hairline); }
  .given { background:var(--bg-sunken); }
  .placed { background:var(--surface-raised); box-shadow:var(--shadow-cell); }
  .err { background:var(--wrong-tint); box-shadow:0 0 0 2px var(--wrong) inset; }
  .cell svg { width:26px; height:26px; }
  .cap { display:flex; gap:9px; justify-content:center; margin-top:9px; }
  .cap span { width:46px; text-align:center; font-size:9px; color:var(--fg-3); font-weight:600; letter-spacing:0.02em; }
  .hd { margin-bottom:16px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="hd"><span class="label">Cells · Paper</span></div>
    <div class="row">
      <div class="cell empty"></div>
      <div class="cell given"><svg viewBox="0 0 100 100"><path d="M50 8 C57 18 74 34 74 54 C74 70 63 84 50 84 C37 84 26 70 26 54 C26 34 43 18 50 8 Z" fill="var(--symbol-fire)"/></svg></div>
      <div class="cell placed"><svg viewBox="0 0 100 100"><path d="M50 8 C57 18 74 34 74 54 C74 70 63 84 50 84 C37 84 26 70 26 54 C26 34 43 18 50 8 Z" fill="var(--symbol-fire)"/></svg></div>
      <div class="cell placed"><svg viewBox="0 0 100 100"><path d="M50 92 C43 82 26 66 26 46 C26 30 37 16 50 16 C63 16 74 30 74 46 C74 66 57 82 50 92 Z" fill="var(--symbol-water)"/></svg></div>
      <div class="cell err"><svg viewBox="0 0 100 100"><path d="M50 8 C57 18 74 34 74 54 C74 70 63 84 50 84 C37 84 26 70 26 54 C26 34 43 18 50 8 Z" fill="var(--symbol-fire)"/></svg></div>
    </div>
    <div class="cap"><span>empty</span><span>given</span><span>placed</span><span>placed</span><span>error</span></div>
  </div>
  <div class="panel dk dark">
    <div class="hd"><span class="label">Cells · Ink</span></div>
    <div class="row">
      <div class="cell empty"></div>
      <div class="cell given"><svg viewBox="0 0 100 100"><path d="M50 8 C57 18 74 34 74 54 C74 70 63 84 50 84 C37 84 26 70 26 54 C26 34 43 18 50 8 Z" fill="var(--symbol-fire)"/></svg></div>
      <div class="cell placed"><svg viewBox="0 0 100 100"><path d="M50 8 C57 18 74 34 74 54 C74 70 63 84 50 84 C37 84 26 70 26 54 C26 34 43 18 50 8 Z" fill="var(--symbol-fire)"/></svg></div>
      <div class="cell placed"><svg viewBox="0 0 100 100"><path d="M50 92 C43 82 26 66 26 46 C26 30 37 16 50 16 C63 16 74 30 74 46 C74 66 57 82 50 92 Z" fill="var(--symbol-water)"/></svg></div>
      <div class="cell err"><svg viewBox="0 0 100 100"><path d="M50 92 C43 82 26 66 26 46 C26 30 37 16 50 16 C63 16 74 30 74 46 C74 66 57 82 50 92 Z" fill="var(--symbol-water)"/></svg></div>
    </div>
    <div class="cap"><span>empty</span><span>given</span><span>placed</span><span>placed</span><span>error</span></div>
  </div>
</body>
</html>
