<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:30px 34px; background:var(--bg); }
  .spec { display:flex; align-items:baseline; gap:16px; padding:10px 0; border-bottom:1px solid var(--hairline); }
  .spec:last-child { border-bottom:none; }
  .meta { width:120px; flex:none; }
  .meta .label { display:block; }
  .meta .px { font-size:11px; color:var(--fg-3); font-variant-numeric:tabular-nums; margin-top:3px; }
</style>
</head>
<body>
  <div class="spec">
    <div class="meta"><span class="label">Display</span><span class="px">56 / 500</span></div>
    <div class="display">Solve by light</div>
  </div>
  <div class="spec">
    <div class="meta"><span class="label">Heading 1</span><span class="px">36 / 500</span></div>
    <div class="h1">Today&rsquo;s puzzle</div>
  </div>
  <div class="spec">
    <div class="meta"><span class="label">Heading 2</span><span class="px">26 / 500</span></div>
    <div class="h2">Four quiet rules</div>
  </div>
  <div class="spec">
    <div class="meta"><span class="label">Heading 3</span><span class="px">20 / 500</span></div>
    <div class="h3">No more than two</div>
  </div>
</body>
</html>
