<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:26px 32px; background:var(--bg); }
  .head { margin-bottom:18px; }
  .scale { display:flex; align-items:flex-end; gap:14px; }
  .step { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:var(--accent-tint); border:1px solid var(--accent); border-radius:4px; width:22px; }
  .v { font-size:11px; color:var(--fg-2); font-variant-numeric:tabular-nums; font-weight:600; }
  .t { font-size:10px; color:var(--fg-3); }
</style>
</head>
<body>
  <div class="head"><span class="label">8&#8209;point spacing scale</span></div>
  <div class="scale">
    <div class="step"><div class="bar" style="height:4px"></div><span class="v">4</span><span class="t">space&#8209;1</span></div>
    <div class="step"><div class="bar" style="height:8px"></div><span class="v">8</span><span class="t">space&#8209;2</span></div>
    <div class="step"><div class="bar" style="height:12px"></div><span class="v">12</span><span class="t">space&#8209;3</span></div>
    <div class="step"><div class="bar" style="height:16px"></div><span class="v">16</span><span class="t">space&#8209;4</span></div>
    <div class="step"><div class="bar" style="height:24px"></div><span class="v">24</span><span class="t">space&#8209;5</span></div>
    <div class="step"><div class="bar" style="height:32px"></div><span class="v">32</span><span class="t">space&#8209;6</span></div>
    <div class="step"><div class="bar" style="height:40px"></div><span class="v">40</span><span class="t">space&#8209;7</span></div>
    <div class="step"><div class="bar" style="height:48px"></div><span class="v">48</span><span class="t">space&#8209;8</span></div>
    <div class="step"><div class="bar" style="height:64px"></div><span class="v">64</span><span class="t">space&#8209;9</span></div>
    <div class="step"><div class="bar" style="height:80px"></div><span class="v">80</span><span class="t">space&#8209;10</span></div>
  </div>
</body>
</html>
