<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:28px 32px; background:var(--bg); }
  .grid { display:flex; gap:10px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--radius-md); border:1px solid rgba(33,28,21,0.08); }
  .name { font-size:11px; font-weight:600; color:var(--fg-1); margin-top:8px; letter-spacing:-0.01em; }
  .hex { font-size:11px; color:var(--fg-3); font-variant-numeric:tabular-nums; margin-top:2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--paper-50)"></div><div class="name">paper&#8209;50</div><div class="hex">#FBF8F1</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-100)"></div><div class="name">paper&#8209;100</div><div class="hex">#F6F1E8</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-200)"></div><div class="name">paper&#8209;200</div><div class="hex">#EFE8DA</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-300)"></div><div class="name">paper&#8209;300</div><div class="hex">#E4DDCD</div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-500)"></div><div class="name">clay&#8209;500</div><div class="hex">#9A9080</div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-600)"></div><div class="name">clay&#8209;600</div><div class="hex">#6B6253</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink&#8209;900</div><div class="hex">#211C15</div></div>
  </div>
</body>
</html>
