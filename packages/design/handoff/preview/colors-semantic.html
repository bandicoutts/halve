<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:24px 28px; background:var(--bg); display:flex; gap:14px; }
  .col { flex:1; border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:18px; background:var(--surface); }
  .row { display:flex; gap:10px; }
  .cell { flex:1; }
  .chip { height:48px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; }
  .glyph { font-size:22px; font-weight:600; }
  .name { font-size:10.5px; font-weight:600; color:var(--fg-2); margin-top:7px; }
  .hd { font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-3); margin:0 0 14px; }
</style>
</head>
<body>
  <div class="col">
    <p class="hd">Feedback · Paper</p>
    <div class="row">
      <div class="cell"><div class="chip" style="background:var(--correct-tint)"><span class="glyph" style="color:var(--correct)">&#10003;</span></div><div class="name">correct</div></div>
      <div class="cell"><div class="chip" style="background:var(--correct)"></div><div class="name">#4E8A66</div></div>
      <div class="cell"><div class="chip" style="background:var(--wrong-tint)"><span class="glyph" style="color:var(--wrong)">&#10007;</span></div><div class="name">wrong</div></div>
      <div class="cell"><div class="chip" style="background:var(--wrong)"></div><div class="name">#C2564B</div></div>
    </div>
  </div>
  <div class="col dark" style="background:var(--bg)">
    <p class="hd">Feedback · Ink</p>
    <div class="row">
      <div class="cell"><div class="chip" style="background:var(--correct-tint)"><span class="glyph" style="color:var(--correct)">&#10003;</span></div><div class="name">correct</div></div>
      <div class="cell"><div class="chip" style="background:var(--correct)"></div><div class="name">#6FB389</div></div>
      <div class="cell"><div class="chip" style="background:var(--wrong-tint)"><span class="glyph" style="color:var(--wrong)">&#10007;</span></div><div class="name">wrong</div></div>
      <div class="cell"><div class="chip" style="background:var(--wrong)"></div><div class="name">#DC7A6E</div></div>
    </div>
  </div>
</body>
</html>
