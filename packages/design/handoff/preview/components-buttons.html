<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:28px 32px; background:var(--bg); display:flex; flex-direction:column; gap:16px; }
  .row { display:flex; gap:12px; align-items:center; }
  .btn { font-family:var(--font-sans); font-size:15px; font-weight:500; border:none; cursor:pointer; padding:0 22px; height:46px; border-radius:var(--radius-full); display:inline-flex; align-items:center; gap:9px; letter-spacing:-0.01em; }
  .btn-primary { background:var(--accent); color:var(--on-accent); }
  .btn-primary.press { background:var(--accent-strong); transform:scale(0.98); }
  .btn-secondary { background:transparent; color:var(--fg-1); border:1.5px solid var(--hairline-2); }
  .btn-ghost { background:transparent; color:var(--fg-2); }
  .btn-ghost:hover { color:var(--fg-1); }
  .state { font-size:10px; color:var(--fg-3); margin-top:7px; text-align:center; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; }
  .stack { display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
  <div class="row">
    <div class="stack"><button class="btn btn-primary">Play today</button><span class="state">default</span></div>
    <div class="stack"><button class="btn btn-primary press">Play today</button><span class="state">pressed</span></div>
    <div class="stack"><button class="btn btn-secondary">Practice</button><span class="state">secondary</span></div>
    <div class="stack"><button class="btn btn-ghost">Skip</button><span class="state">ghost</span></div>
  </div>
</body>
</html>
