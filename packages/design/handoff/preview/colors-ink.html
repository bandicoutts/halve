<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:28px 32px; background:var(--bg); }
  .grid { display:flex; gap:10px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--radius-md); border:1px solid rgba(255,255,255,0.08); }
  .name { font-size:11px; font-weight:600; color:var(--fg-1); margin-top:8px; letter-spacing:-0.01em; }
  .hex { font-size:11px; color:var(--fg-3); font-variant-numeric:tabular-nums; margin-top:2px; }
</style>
</head>
<body class="dark">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--night-950)"></div><div class="name">night&#8209;950</div><div class="hex">#14110B</div></div>
    <div class="sw"><div class="chip" style="background:var(--night-850)"></div><div class="name">night&#8209;850</div><div class="hex">#221D15</div></div>
    <div class="sw"><div class="chip" style="background:var(--night-800)"></div><div class="name">night&#8209;800</div><div class="hex">#2A2418</div></div>
    <div class="sw"><div class="chip" style="background:var(--night-700)"></div><div class="name">night&#8209;700</div><div class="hex">#352E20</div></div>
    <div class="sw"><div class="chip" style="background:var(--dust-500)"></div><div class="name">dust&#8209;500</div><div class="hex">#6E6553</div></div>
    <div class="sw"><div class="chip" style="background:var(--dust-300)"></div><div class="name">dust&#8209;300</div><div class="hex">#A79D89</div></div>
    <div class="sw"><div class="chip" style="background:var(--dust-100)"></div><div class="name">dust&#8209;100</div><div class="hex">#EFE8D9</div></div>
  </div>
</body>
</html>
