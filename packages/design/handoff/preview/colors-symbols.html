<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:28px 32px; background:var(--bg); display:flex; gap:10px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--radius-md); border:1px solid rgba(33,28,21,0.06); }
  .name { font-size:11px; font-weight:600; color:var(--fg-1); margin-top:8px; letter-spacing:-0.01em; }
  .hex { font-size:11px; color:var(--fg-3); font-variant-numeric:tabular-nums; margin-top:2px; }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:var(--water)"></div><div class="name">water</div><div class="hex">#2A7A6E · on paper</div></div>
  <div class="sw"><div class="chip" style="background:var(--water-bright)"></div><div class="name">water&#8209;bright</div><div class="hex">#6EC8BC · on ink</div></div>
  <div class="sw"><div class="chip" style="background:var(--water-ink)"></div><div class="name">water&#8209;ink</div><div class="hex">#1E5C52</div></div>
  <div class="sw"><div class="chip" style="background:var(--fire-disc)"></div><div class="name">fire&#8209;disc</div><div class="hex">#D45220 · both</div></div>
</body>
</html>
