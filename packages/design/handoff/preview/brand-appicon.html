<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; width:700px; box-sizing:border-box; padding:30px 32px; background:var(--bg); display:flex; align-items:center; justify-content:center; gap:38px; }
  .icon { box-shadow:var(--shadow-md); border-radius:22%; }
  .stack { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .stack span { font-size:10px; color:var(--fg-3); font-weight:600; letter-spacing:0.04em; }
</style>
</head>
<body>
  <div class="stack"><img class="icon" src="../assets/app-icon.svg" width="120" height="120" alt="App icon"><span>120 px</span></div>
  <div class="stack"><img class="icon" src="../assets/app-icon.svg" width="72" height="72" alt="App icon"><span>72 px</span></div>
  <div class="stack"><img class="icon" src="../assets/app-icon.svg" width="44" height="44" alt="App icon"><span>44 px</span></div>
  <div class="stack"><img src="../assets/mark.svg" width="120" height="100" alt="Mark"><span>Mark only</span></div>
</body>
</html>
