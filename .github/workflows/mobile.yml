name: mobile

# Flutter CI for apps/mobile. Mirrors the local gate: pub get → codegen →
# analyze → test. apps/mobile is a standalone Flutter package (NOT a pnpm
# workspace member), so this job is independent of the Node/pnpm tooling.

on:
  push:
    branches: [main, feat/mobile-app]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  mobile:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
