name: web

# CI for apps/web. Runs typecheck, tests, and build.
#
# NOTE — gen:types: Running `pnpm gen:types` in CI requires a live Supabase
# instance (local or cloud). Until a Supabase container is added to this job,
# run `pnpm --filter @parity/web gen:types` locally after any schema migration
# and commit the updated src/lib/supabase/types.ts. If types drift, tsc will
# surface the resulting type errors here.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/engine/**"
      - "packages/design/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/engine/**"
      - "packages/design/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    name: typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Test (engine + web)
        run: pnpm test

      - name: Build web
        run: pnpm --filter @parity/web build
